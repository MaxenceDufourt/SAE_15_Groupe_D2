<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
  </defs>

  <!-- Fond arrondi -->
  <rect width="64" height="64" rx="14" fill="url(#fond)"/>

  <!-- Liaisons du réseau -->
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.85">
    <line x1="32" y1="32" x2="15" y2="17"/>
    <line x1="32" y1="32" x2="49" y2="17"/>
    <line x1="32" y1="32" x2="15" y2="47"/>
    <line x1="32" y1="32" x2="49" y2="47"/>
  </g>

  <!-- Noeuds périphériques -->
  <g fill="#ffffff">
    <circle cx="15" cy="17" r="5"/>
    <circle cx="49" cy="17" r="5"/>
    <circle cx="15" cy="47" r="5"/>
    <circle cx="49" cy="47" r="5"/>
  </g>

  <!-- Noeud central -->
  <circle cx="32" cy="32" r="9" fill="#ffffff"/>
  <circle cx="32" cy="32" r="4" fill="#4f46e5"/>
</svg>
